<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#081522">
  <title>Sprite Tracker Collection</title>
  <meta name="description" content="View a shared Sprite Tracker collection.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="hero">
      <div>
        <p class="eyebrow">SPRITE TRACKER</p>
        <h1>Shared Collection</h1>
        <p class="subtitle">See which Sprite variants this Tracker has collected.</p>
      </div>
      <div class="status-pill" id="shareStatus">Reading collection…</div>
    </section>

    <section class="stats" aria-label="Collection summary">
      <article class="stat-card">
        <span class="stat-label">Owned</span>
        <strong id="ownedCount">0</strong>
      </article>
      <article class="stat-card">
        <span class="stat-label">Missing</span>
        <strong id="missingCount">0</strong>
      </article>
      <article class="stat-card">
        <span class="stat-label">Total</span>
        <strong id="totalCount">0</strong>
      </article>
    </section>

    <section class="toolbar">
      <div class="segmented" role="group" aria-label="Collection filter">
        <button class="filter-button active" data-filter="all" type="button">All</button>
        <button class="filter-button" data-filter="owned" type="button">Owned</button>
        <button class="filter-button" data-filter="missing" type="button">Missing</button>
      </div>
    </section>

    <section>
      <div id="message" class="message" hidden></div>
      <div id="spriteGrid" class="sprite-grid" aria-live="polite"></div>
    </section>

    <footer>
      <p>Shared from Sprite Tracker</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
